services:
  - type: web
    name: mmt-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      # DB free của Render tự xoá sau 30 ngày — chuyển sang Neon (Postgres
      # free vĩnh viễn, không hết hạn). Giá trị thật đặt tay trong dashboard
      # Render (Environment tab), không lưu trong file này.
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://mmt-frontend-5in5.onrender.com,https://minhminhthuy.io.vn,https://www.minhminhthuy.io.vn
      - key: NOTIFY_TO_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash

  - type: web
    name: mmt-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://mmt-backend-k6mc.onrender.com/api/*
      - type: rewrite
        source: /su-kien
        destination: /su-kien/index.html
      - type: rewrite
        source: /tiec-cuoi
        destination: /tiec-cuoi/index.html
      - type: rewrite
        source: /su-kien/nha-bat-su-kien
        destination: /su-kien/nha-bat-su-kien/index.html
      - type: rewrite
        source: /su-kien/khai-truong-dong-tho-ra-quan
        destination: /su-kien/khai-truong-dong-tho-ra-quan/index.html
      - type: rewrite
        source: /su-kien/hoi-nghi-hoi-thao
        destination: /su-kien/hoi-nghi-hoi-thao/index.html
      - type: rewrite
        source: /tiec-cuoi/trang-tri-ban-tho-gia-tien
        destination: /tiec-cuoi/trang-tri-ban-tho-gia-tien/index.html
      - type: rewrite
        source: /tiec-cuoi/mam-qua-cuoi-hoi
        destination: /tiec-cuoi/mam-qua-cuoi-hoi/index.html
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
