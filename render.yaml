databases:
  - name: mmt-db
    plan: free
    databaseName: mmt_event_wedding
    user: mmt_user

services:
  - type: web
    name: mmt-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: mmt-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: mmt-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: mmt-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: mmt-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: mmt-db
          property: password
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://mmt-frontend-5in5.onrender.com,https://minhminhthuy.io.vn,https://www.minhminhthuy.io.vn
      - key: NOTIFY_TO_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash

  - type: web
    name: mmt-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://mmt-backend-k6mc.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
