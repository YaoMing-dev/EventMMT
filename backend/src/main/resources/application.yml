server:
  port: ${PORT:8080}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:mmt_event_wedding}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  security:
    user:
      name: ${ADMIN_USERNAME:admin}
      password: ${ADMIN_PASSWORD:changeme}
app:
  images:
    base-path: ${IMAGES_BASE_PATH:D:/Job/images}
  notify:
    to-email: ${NOTIFY_TO_EMAIL:dvminhthuy@gmail.com}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  resend:
    api-key: ${RESEND_API_KEY:}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.6-flash}
