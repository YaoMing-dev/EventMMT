server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/mmt_event_wedding
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  security:
    user:
      name: admin
      password: changeme
  mail:
    host: smtp.gmail.com
    port: 587
    username: your-email@gmail.com
    password: your-gmail-app-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  images:
    base-path: D:/Job/images
  notify:
    to-email: your-email@gmail.com
